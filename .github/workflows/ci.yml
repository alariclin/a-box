name: A-Box CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl python3 shellcheck
      - name: Run repository test suite
        run: bash tests/run-all.sh
      - name: ShellCheck errors
        run: shellcheck -S error -x install.sh tests/*.sh

  alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Run tests in Alpine 3.24
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            alpine:3.24 \
            sh -ec 'apk add --no-cache bash python3 jq openssl coreutils util-linux tar && bash tests/run-all.sh'
